name: Setup
description: Install dependencies and build @dw/ui

inputs:
  playwright:
    description: Install Playwright Chromium when true
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    - if: inputs.playwright == 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
    - run: npm run build -w @dw/ui
      shell: bash
