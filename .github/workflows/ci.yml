name: ci

on:
  push:
  pull_request:

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: npm run test:coverage -w @dw/ui

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
        with:
          playwright: "true"
      - run: npm run test:a11y -w @dw/ui

  compare-layout-styles:
    name: compare-layout-styles
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
        with:
          playwright: "true"
      - run: npm run compare-layout-styles
