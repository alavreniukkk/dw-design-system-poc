name: Figma To Code

on:
  workflow_dispatch:
    inputs:
      url:
        description: Figma node URL
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Require Figma token
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "Add repository secret FIGMA_TOKEN"
            exit 1
          fi

      - name: Compare node
        id: map
        continue-on-error: true
        timeout-minutes: 20
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_URL: ${{ inputs.url }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: node scripts/figma/sync-node.mjs "$FIGMA_URL"

      - name: Show compare output
        if: steps.map.outcome == 'failure'
        run: |
          for file in scripts/figma/out/unmapped.json; do
            if [ -f "$file" ]; then
              echo "::group::$file"
              cat "$file"
              echo "::endgroup::"
            fi
          done

      - name: Publish draft
        if: steps.map.outcome == 'success' || steps.map.outcome == 'failure'
        env:
          FIGMA_URL: ${{ inputs.url }}
          GH_TOKEN: ${{ github.token }}
          MAP_OK: ${{ steps.map.outcome == 'success' }}
        run: |
          set -euo pipefail
          meta=scripts/figma/out/component.json
          token=packages/ui/src/styles/tokens.css
          if [ ! -f "$meta" ]; then
            echo "compare-node did not name the component"
            exit 1
          fi
          name=$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).name")
          slug=$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).slug")
          file=$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).file ?? ''")
          branch="figma/$slug"

          dirty=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            dirty+=("${line:3}")
          done < <(git status --porcelain=v1 -uall)

          agent=0
          for path in "${dirty[@]}"; do
            case "$path" in
              packages/ui/*)
                if [ "$path" != "$token" ]; then
                  agent=1
                fi
                ;;
              *)
                echo "unexpected change: $path"
                exit 1
                ;;
            esac
          done
          if [ "$MAP_OK" != "true" ] && [ "$agent" -ne 1 ]; then
            echo "compare failed with no component patch"
            exit 1
          fi

          if [ ${#dirty[@]} -eq 0 ]; then
            echo "no token changes"
            if [ "$MAP_OK" != "true" ]; then
              exit 1
            fi
            exit 0
          fi

          if git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"; then
            git stash push -u -m figma-sync -- "${dirty[@]}"
            git checkout -B "$branch" "origin/$branch"
            git stash pop
          else
            git checkout -B "$branch"
          fi

          git add -- "${dirty[@]}"
          if git diff --cached --quiet; then
            echo "no token changes"
            if [ "$MAP_OK" != "true" ]; then
              exit 1
            fi
            exit 0
          fi

          title="Sync ${name} from Figma"
          token_diff=$(git diff --cached)
          unchanged=""
          if [ "$(git diff --cached --name-only)" = "$token" ] && [ -n "$file" ]; then
            unchanged="Unchanged: ${file}."
          fi
          body_file=$(mktemp)
          {
            printf '%s\n' "Source: $FIGMA_URL"
            printf '\n'
            printf '%s\n' "Changed:"
            git diff --cached --name-only | while IFS= read -r path; do
              printf '%s\n' "- $path"
            done
            printf '\n'
            printf '%s\n' '```diff'
            printf '%s\n' "$token_diff"
            printf '%s\n' '```'
            if [ -n "$unchanged" ]; then
              printf '\n'
              printf '%s\n' "$unchanged"
            fi
          } > "$body_file"

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync ${name} from Figma." -m "$FIGMA_URL"
          git push origin "HEAD:$branch"

          existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$body_file"
          else
            gh pr create --draft --base main --head "$branch" \
              --title "$title" \
              --body-file "$body_file"
          fi
          if [ "$MAP_OK" != "true" ]; then
            echo "compare did not pass; draft left for review"
            exit 1
          fi
